version: '3.8'

services:
  chess-backend:
    build: ./backend
    container_name: chess-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    restart: unless-stopped
    networks:
      - chess-network

  chess-frontend:
    image: nginx:alpine
    container_name: chess-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend/build:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - chess-backend
    restart: unless-stopped
    networks:
      - chess-network

  chess-app-node:
    build: .
    container_name: chess-app-node
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    depends_on:
      - chess-backend
    restart: unless-stopped
    networks:
      - chess-network

networks:
  chess-network:
    driver: bridge

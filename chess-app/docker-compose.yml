version: '3.8'

services:
  chess-backend:
    image: chess-app-backend:latest
    container_name: chess-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
    restart: unless-stopped
    networks:
      - chess-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  chess-frontend:
    image: nginx:alpine
    container_name: chess-frontend
    ports:
      - "3000:80"
    volumes:
      - ./build:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - chess-backend
    restart: unless-stopped
    networks:
      - chess-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  chess-network:
    driver: bridge

